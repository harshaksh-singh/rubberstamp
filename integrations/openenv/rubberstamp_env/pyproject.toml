# RubberStamp's helpdesk world as an OpenEnv environment (openenv 0.14.0). Its own uv project with its own lock:
# the core workspace (packages/*) is untouched and is used through editable path sources. Flat layout, as
# `openenv init` generates it: the package is this directory (`rubberstamp_env`), the server is `server/`.

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubberstamp-env"
version = "0.1.0"
description = "RubberStamp's Tarnwick Helpdesk world as an OpenEnv environment: 500 seeded instances, strict reward"
readme = "README.md"
license = "MIT"
authors = [
    { name = "harshaksh-singh", email = "singhharshaksh@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "openenv==0.14.0",
    "rs-core",
    "rs-verify",
    # Not rs-world[mcp]: openenv 0.14.0 needs fastmcp>=3,<4 and the extra needs fastmcp>=4.2.4 (unsatisfiable).
    # The 16 tools are served through OpenEnv's own MCP actions and /mcp route instead (see README).
    "rs-world",
    "rs-suite",
]

[project.optional-dependencies]
# The TRL `environment_factory` wrapper (trl_env.py) builds its tool methods with rs_train.env.
trl = ["trl==1.18.2", "rs-train"]

[project.scripts]
# `uv run server --port 18500` (the OpenEnv multi-mode convention: a `server` entry point to app:main).
server = "rubberstamp_env.server.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.setuptools]
packages = ["rubberstamp_env", "rubberstamp_env.server"]
package-dir = { "rubberstamp_env" = ".", "rubberstamp_env.server" = "server" }

[tool.uv]
# The flat layout is installed editable, so tests import `rubberstamp_env` from this directory.
package = true

[tool.uv.sources]
rs-core = { path = "../../../packages/rs-core", editable = true }
rs-verify = { path = "../../../packages/rs-verify", editable = true }
rs-world = { path = "../../../packages/rs-world", editable = true }
rs-suite = { path = "../../../packages/rs-suite", editable = true }
rs-audit = { path = "../../../packages/rs-audit", editable = true }
rs-train = { path = "../../../packages/rs-train", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rubberstamp_env", "oe_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: the full 500-instance conformance run (sharded across processes)",
    "trl: needs the `trl` extra (uv sync --extra trl)",
]

[tool.pyright]
# `uv run pyright` from this directory. The flat layout is installed editable as `rubberstamp_env`.
venvPath = "."
venv = ".venv"
include = ["__init__.py", "models.py", "client.py", "driver.py", "quality.py", "trl_env.py", "server", "scripts", "tests"]
extraPaths = ["tests", ".."]  # "..": resolve `rubberstamp_env` to this directory (setuptools' editable finder is a hook)
pythonVersion = "3.12"
typeCheckingMode = "standard"
