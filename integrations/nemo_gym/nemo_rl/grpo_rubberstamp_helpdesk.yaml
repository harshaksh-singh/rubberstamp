# GRPO on rubberstamp_helpdesk with NeMo RL v0.8.0. NOT RUN: it needs the NeMo RL v0.8.0 container and GPUs.
#
# An overlay on NeMo RL's own Gym recipe for the same class of environment (workplace_assistant: multi-step tool use
# through simple_agent), which keeps that recipe's model, backend and cluster shape (Nemotron Nano 9B v2, Megatron,
# 8 GPUs) and changes only what this environment needs. The keys below were read from the v0.8.0 tag
# (examples/nemo_gym/*.yaml, nemo_rl/utils/config.py's `defaults` inheritance); none were exercised here.
#
# In the container (/opt/nemo-rl), with this repository at $RS:
#   export NEMO_GYM_EXTRA_ROOTS=$RS/integrations/nemo_gym            # Gym finds resources_servers/rubberstamp_helpdesk
#   uv run --directory $RS/integrations/nemo_gym python scripts/build_gym_dataset.py
#   gym dataset collate "+config_paths=[resources_servers/rubberstamp_helpdesk/configs/rubberstamp_helpdesk.yaml]" \
#       +output_dirpath=$RS/integrations/nemo_gym/collated +mode=train_preparation +should_download=false
#   uv run examples/nemo_gym/run_grpo_nemo_gym.py --config $RS/integrations/nemo_gym/nemo_rl/grpo_rubberstamp_helpdesk.yaml \
#       data.train.data_path=$RS/integrations/nemo_gym/collated/train.jsonl \
#       data.validation.data_path=$RS/integrations/nemo_gym/collated/validation.jsonl
#
# The reward is the server's `reward` (strict). The server never emits reward_components, so NeMo RL's
# reward == sum(reward_components) check does not apply and GDPO has no lenient column to train on. A replay mismatch
# arrives as instance_config.mask_sample, which v0.8.0 drops from the loss while should_mask_flagged_samples is true.
defaults: /opt/nemo-rl/examples/nemo_gym/grpo_workplace_assistant_nemotron_nano_v2_9b.yaml

grpo:
  num_prompts_per_step: 4
  num_generations_per_prompt: 8

checkpointing:
  checkpoint_dir: results/grpo-rubberstamp-helpdesk

data:
  train:
    data_path: ???  # collated/train.jsonl (train split, 300 instances)
  validation:
    data_path: ???  # collated/validation.jsonl (dev split, 80 instances)

env:
  should_mask_flagged_samples: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml  # must come first
    - resources_servers/rubberstamp_helpdesk/configs/rubberstamp_helpdesk.yaml

logger:
  log_dir: logs/grpo-rubberstamp-helpdesk
  wandb_enabled: false
  wandb:
    project: grpo-rubberstamp-helpdesk
    name: rubberstamp-helpdesk-strict
  mlflow:
    experiment_name: grpo-rubberstamp-helpdesk
    run_name: rubberstamp-helpdesk-strict
