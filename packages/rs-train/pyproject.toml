[project]
name = "rs-train"
version = "0.1.0"
description = "RubberStamp: GRPO training harness, multiplexed design, offline rescoring and metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rs-core",
    "pydantic>=2.9",
    "pyyaml>=6.0.1",
    "numpy>=1.26",
    "scipy>=1.14",
    "trl==1.18.2",
    "peft>=0.17.0",
    "transformers>=4.56.2",
    "datasets>=4.7.0",
]

[project.optional-dependencies]
# vLLM is CUDA-only (the locked 0.33.0 and torch 2.14.0 are CUDA 13 builds). On the rented Linux GPU box run
# `uv sync --extra gpu` at the workspace root, whose own `gpu` extra pulls this one.
gpu = ["vllm>=0.23.0,<0.34.0; sys_platform == 'linux'"]

[project.scripts]
rs-train = "rs_train.train:main"

[tool.uv.sources]
rs-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
