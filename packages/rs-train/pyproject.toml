[project]
name = "rs-train"
version = "0.1.0"
description = "RubberStamp: GRPO training harness, multiplexed design, offline rescoring and metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "harshaksh-singh", email = "singhharshaksh@gmail.com" }
]
requires-python = ">=3.12, <3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "rs-core",
    "rs-verify",   # the toy world grades with rs-verify's toy verifiers (toy.py)
    "rs-world",    # the helpdesk world and its graders: imported only by rs_train.helpdesk
    "rs-suite",
    "pydantic>=2.9",
    "pyyaml>=6.0.1",
    "numpy>=1.26",
    "scipy>=1.14",
    "trl==1.18.2",
    "peft>=0.17.0",
    "transformers>=4.56.2",
    "datasets>=4.7.0",
]

[project.urls]
Homepage = "https://harshaksh-singh.github.io/rubberstamp/"
Source = "https://github.com/harshaksh-singh/rubberstamp"
Documentation = "https://github.com/harshaksh-singh/rubberstamp/tree/main/packages/rs-train#readme"
Changelog = "https://github.com/harshaksh-singh/rubberstamp/blob/main/CHANGELOG.md"
Issues = "https://github.com/harshaksh-singh/rubberstamp/issues"

[project.optional-dependencies]
# vLLM is CUDA-only (the locked 0.33.0 and torch 2.14.0 are CUDA 13 builds). On the rented Linux GPU box run
# `uv sync --extra gpu` at the workspace root, whose own `gpu` extra pulls this one.
gpu = ["vllm>=0.23.0,<0.34.0; sys_platform == 'linux'"]

[project.scripts]
rs-train = "rs_train.train:main"

[tool.uv.sources]
rs-core = { workspace = true }
rs-verify = { workspace = true }
rs-world = { workspace = true }
rs-suite = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
