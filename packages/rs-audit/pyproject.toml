[project]
name = "rs-audit"
version = "0.1.0"
description = "RubberStamp adapter for OpenAdapt verifier_audit: audit verifier variants before RL training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openadapt-flow==3.4.0",
    "rs-core",
]

[project.scripts]
rs-audit = "rs_audit.cli:main"

[tool.uv.sources]
rs-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
