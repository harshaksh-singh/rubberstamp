[project]
name = "wf-audit"
version = "0.1.0"
description = "WorldForge adapter for OpenAdapt verifier_audit: audit verifier variants before RL training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openadapt-flow==3.4.0",
    "wf-core",
]

[project.scripts]
wf-audit = "wf_audit.cli:main"

[tool.uv.sources]
wf-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
