[project]
name = "wf-suite"
version = "0.1.0"
description = "Strict verifier specs for the Tarnwick Helpdesk tasks, their blind-spot variants, and the world's audit target"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = ["wf-core", "wf-verify", "wf-world", "wf-audit"]

[tool.uv.sources]
wf-core = { workspace = true }
wf-verify = { workspace = true }
wf-world = { workspace = true }
wf-audit = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
