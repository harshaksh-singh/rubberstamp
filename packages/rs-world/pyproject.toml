[project]
name = "rs-world"
version = "0.1.0"
description = "Tarnwick Helpdesk: a deterministic one-app SQLite world with MCP tools and hand-written tasks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "harshaksh-singh", email = "singhharshaksh@gmail.com" }
]
requires-python = ">=3.12, <3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "faker==40.63.0",  # exact: seeded Faker output (customer names) shifts the world generator's RNG stream
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rs-core",
]

[project.optional-dependencies]
# The MCP server (`rs_world.mcp_server`, `rs-world serve`). Everything else (seeding, tools, tasks, the executor)
# works without it.
mcp = ["fastmcp>=4.2.4"]

[project.urls]
Homepage = "https://harshaksh-singh.github.io/rubberstamp/"
Source = "https://github.com/harshaksh-singh/rubberstamp"
Documentation = "https://github.com/harshaksh-singh/rubberstamp/tree/main/packages/rs-world#readme"
Changelog = "https://github.com/harshaksh-singh/rubberstamp/blob/main/CHANGELOG.md"
Issues = "https://github.com/harshaksh-singh/rubberstamp/issues"

[project.scripts]
rs-world = "rs_world.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
rs-core = { workspace = true }
