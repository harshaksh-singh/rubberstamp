[project]
name = "wf-verify"
version = "0.1.0"
description = "Spec verifiers with switchable blind spots (BlindSpot RL, Track A)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["wf-core", "pydantic>=2.9"]

[tool.uv.sources]
wf-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
