[project]
name = "wf-world"
version = "0.1.0"
description = "Tarnwick Helpdesk: a deterministic one-app SQLite world with MCP tools and hand-written tasks"
readme = "README.md"
authors = [
    { name = "harshaksh-singh", email = "singhharshaksh@gmail.com" }
]
requires-python = ">=3.12, <3.14"
dependencies = [
    "faker>=40.63.0",
    "fastmcp>=4.2.4",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "wf-core",
]

[project.scripts]
wf-world = "wf_world.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
wf-core = { workspace = true }
