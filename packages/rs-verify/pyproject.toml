[project]
name = "rs-verify"
version = "0.1.0"
description = "Spec verifiers with switchable blind spots (RubberStamp)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "harshaksh-singh", email = "singhharshaksh@gmail.com" }
]
requires-python = ">=3.12, <3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["rs-core", "pydantic>=2.9"]

[project.urls]
Homepage = "https://harshaksh-singh.github.io/rubberstamp/"
Source = "https://github.com/harshaksh-singh/rubberstamp"
Documentation = "https://github.com/harshaksh-singh/rubberstamp/tree/main/packages/rs-verify#readme"
Changelog = "https://github.com/harshaksh-singh/rubberstamp/blob/main/CHANGELOG.md"
Issues = "https://github.com/harshaksh-singh/rubberstamp/issues"

[tool.uv.sources]
rs-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
