# Workflow-security lint (zizmor) and a known-vulnerability audit of the locked dependencies (pip-audit, npm audit).
# The tool versions below are pinned by hand: Dependabot does not update `uvx` arguments.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"   # weekly, so newly published advisories show up without a push
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: zizmor (GitHub Actions security lint)
        run: uvx zizmor@1.33.1 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; enables the online audits (impostor commits, known-vulnerable actions)

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Python (pip-audit over uv.lock, every extra and group)
        # Ignored: setuptools 80.10.2 advisories PYSEC-2026-3447 (MANIFEST.in excludes bypassed by NFD file names on
        # macOS when building an sdist) and GHSA-xmj3-9gf7-h52w (legacy wheel install path escape on Windows). Nothing
        # here builds or installs packages with setuptools (uv_build, uv). The lock holds 80.10.2 because vLLM 0.33
        # (the gpu extra) requires setuptools<81; drop the ignores when the gpu extra allows a fixed setuptools.
        run: |
          uv export --frozen --no-emit-workspace --no-hashes --all-extras --all-groups --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w
      - name: npm, site (runtime dependencies, high and critical)
        working-directory: site
        run: npm audit --omit=dev --audit-level=high
      - name: npm, helpdesk app (runtime dependencies, high and critical)
        working-directory: apps/helpdesk
        run: npm audit --omit=dev --audit-level=high
