# Builds the project site (site/, Astro) and deploys it to GitHub Pages after CI passes on main, for the commit that is
# still the head of main. To redeploy, re-run CI on main or run it by hand on main. Only the deploy job holds the Pages and OIDC permissions; the build job (which
# runs npm install scripts) can read the repository and nothing else.
name: Site

on:
  # The trigger runs this file from main with the repository's token. The build job (and so the deploy job, which
  # needs it) runs only for a successful CI run of a push to, or a manual run on, this repository's main (a fork's
  # pull request can come from a branch named main); it builds that run's commit and never reads the run's artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI runs on main are not cancelled, so an older commit's CI can finish after a newer one's. Deploy a run's commit
  # only while it is still the head of main; otherwise the newer commit's own CI run deploys it.
  current:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - name: Is this run's commit still the head of main?
        id: head
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          main_sha="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$main_sha" = "$RUN_SHA" ]; then latest=true; else latest=false; fi
          echo "run ${RUN_SHA}, main ${main_sha}: latest=${latest}"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

  build:
    needs: current
    if: needs.current.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: site
          node-version: "24"
          cache: false   # no Astro build cache in the job that produces the deployed site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # the OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
