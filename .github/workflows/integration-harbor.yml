# The Harbor integration (integrations/harbor, its own uv project and lock): lint, type-check, check that the committed
# dataset sample and manifest are current, and run its tests, including rs_suite.conformance on all 500 instances x 3
# plans through the generated task folders and the verifier entry point, and isolation at concurrency 8 and 16.
# The Docker gate (images built locally, real `harbor run -e docker` trials, nothing pushed) runs only when started by
# hand. Actions are pinned to the same commit SHAs as ci.yml.
name: Integration (Harbor)

on:
  push:
    branches: [main]
    paths:
      - "integrations/harbor/**"
      - "packages/**"
      - "results/certify/**"
      - ".github/workflows/integration-harbor.yml"
  pull_request:
    paths:
      - "integrations/harbor/**"
      - "packages/**"
      - "results/certify/**"
      - ".github/workflows/integration-harbor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-harbor-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HARBOR_TELEMETRY: "0"   # Harbor sends usage events unless told not to
  UV_NO_SYNC: "1"         # `uv run` uses the environment `uv sync --locked --all-extras` built

jobs:
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-suffix: harbor
          cache-dependency-glob: integrations/harbor/uv.lock
      - name: Install (harbor==0.27.0 and the workspace packages as path dependencies)
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run pyright
      - name: Committed dataset sample and manifest are current
        run: uv run rs-harbor committed --check
      - name: Test (all-500 conformance, isolation, verifier faults, reward rule, harbor lint of the sample)
        run: uv run pytest -q -n 4 --dist loadfile

  harbor-docker:
    # Builds rs-harbor-helpdesk and rs-harbor-verifier locally and runs real Harbor trials of the committed sample
    # (the gate's `sample` part; `--parts full` and `installed` are run by hand, see integrations/harbor/GATE.md).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: integrations/harbor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-suffix: harbor
          cache-dependency-glob: integrations/harbor/uv.lock
      - name: Install
        run: uv sync --locked --all-extras
      - name: Build the images (local tags only, never pushed)
        run: uv run rs-harbor build-images
      - name: Docker gate (oracle, nop, shortcut, determinism, setup and agent-phase network, faults)
        run: |
          uv run python scripts/docker_gate.py --skip-build --jobs-dir "$RUNNER_TEMP/harbor-jobs" > gate.txt
          sed -n '/^| run |/,$p' gate.txt >> "$GITHUB_STEP_SUMMARY"
