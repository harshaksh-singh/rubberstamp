# Lint, type-check and test the Python workspace; check that the site's data is current and that the site builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_OFFLINE: "1"   # tests that need a cached tokenizer skip themselves
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run pyright packages/rs-core/src packages/rs-verify/src packages/rs-audit/src packages/rs-world/src packages/rs-suite/src packages/rs-train/src
      - name: Test
        run: uv run pytest -q -n auto --dist loadfile
      - name: Site data is current
        run: uv run python scripts/site_data.py --check

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
