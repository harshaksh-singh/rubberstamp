[project]
name = "worldforge"
version = "0.0.1"
requires-python = ">=3.12,<3.14"
dependencies = ["wf-core", "wf-verify", "wf-audit", "wf-world"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wf-core = { workspace = true }
wf-verify = { workspace = true }
wf-audit = { workspace = true }
wf-world = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
markers = ["slow: needs network, GPUs or large downloads"]
